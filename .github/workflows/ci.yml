name: CI

on:
    pull_request:
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    compatibility:
        name: Compatibility (${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Exercise the declared Node floor, every supported major line,
                    # and each native operating-system family.
                    - os: ubuntu-latest
                      node: 24.15.0
                    - os: ubuntu-latest
                      node: 25.x
                    - os: ubuntu-latest
                      node: 26.x
                    - os: macos-latest
                      node: 24.15.0
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run format:check
            - run: npm test

    integration:
        name: Integration (Node 24.15, Ubuntu)
        needs: compatibility
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: npm
            - run: npm ci
            - run: npm run test:docker
            - run: npm run test:prisma
            - run: npm run test:typeorm
            - run: npm run test:package

    package-manager:
        name: Package manager (${{ matrix.package_manager }})
        needs: compatibility
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package_manager: npm
                    - package_manager: pnpm
                      corepack_package: pnpm@10.0.0
                    - package_manager: yarn
                      corepack_package: yarn@4.5.0
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: npm
            - run: npm ci
            - if: matrix.corepack_package
              run: corepack enable && corepack install --global ${{ matrix.corepack_package }}
            - run: npm run test:package-manager -- ${{ matrix.package_manager }}
